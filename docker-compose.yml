services:
  portfolio:
    build: .
    container_name: beelsik-portfolio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: beelsik-tunnel
    restart: unless-stopped
    depends_on:
      - portfolio
    command: tunnel --no-autoupdate --url http://portfolio:3000

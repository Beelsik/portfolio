services:
  - type: web
    name: beelsik-portfolio
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: "node server.mjs"
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: google/gemma-4-31b-it
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_MAX
        value: "40"

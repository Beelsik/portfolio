[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "1.0.0"
description = "Deterministic B2B procurement & invoice reconciliation engine before ERP/1C posting: statutory checksums, Decimal accounting, pack normalization, spec-guarded SKU matching, and SHA-256 SQLite audit trail."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Beelsik" }
]
keywords = ["erp", "reconciliation", "procurement", "invoice", "accounting", "sqlite", "audit-trail"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
ledgerguard = "ledgerguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

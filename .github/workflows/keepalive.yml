name: Render Keepalive Ping

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 65 https://beelsik-portfolio.onrender.com/api/health > /dev/null

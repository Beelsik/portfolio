<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #fbfbfa;
  color: #161618;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.frame {
  width: 1200px;
  height: 630px;
  padding: 76px 88px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-top: 6px solid #161618;
}
.eyebrow {
  font-size: 20px;
  font-weight: 500;
  color: #71717a;
  letter-spacing: 0.01em;
}
.title {
  margin-top: 22px;
  font-size: 84px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.04;
  color: #161618;
}
.sub {
  margin-top: 30px;
  font-size: 31px;
  font-weight: 400;
  line-height: 1.42;
  color: #3d3d40;
  max-width: 960px;
}
.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding-top: 26px;
  border-top: 1px solid #d4d4cf;
  font-size: 19px;
  color: #71717a;
  white-space: nowrap;
}
.foot strong {
  color: #161618;
  font-weight: 600;
}
</style>
</head>
<body>
  <div class="frame">
    <div>
      <div class="eyebrow">Python · FastAPI · PostgreSQL · Applied LLM &amp; OCR</div>
      <div class="title">Beelsik</div>
      <div class="sub">Боты, сверка счетов и интеграции с CRM/1С · 3 пакета от 9 000 ₽ · 11 живых стендов</div>
    </div>
    <div class="foot">
      <span><strong>LedgerGuard</strong> · 24/24 проблемных счетов остановлены (набор из 60)</span>
      <span>beelsik-portfolio.onrender.com</span>
    </div>
  </div>
</body>
</html>
